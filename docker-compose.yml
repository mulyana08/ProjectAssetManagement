version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: itam-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-itam_db}
      MYSQL_USER: ${DB_USER:-itam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-itam_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itam-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-itam_db}
      DB_USER: ${DB_USER:-itam_user}
      DB_PASSWORD: ${DB_PASSWORD:-itam_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      CLIENT_URL: http://localhost
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itam-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
